name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests (offline)
        run: python -m pytest tests -q

      - name: CLI smoke test
        run: |
          python -m vxrecon version
          python -m vxrecon doctor

  lint:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff check
        run: ruff check vxrecon tests --select E,F,W --ignore E501 || true
      - name: Byte-compile all modules
        run: python -m compileall -q vxrecon

  no-network-guard:
    name: Verify single network gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure only utils/net.py imports network modules
        shell: bash
        run: |
          # Only the gateway may import socket/urllib/http.client/ssl directly.
          offenders=$(grep -rEl "import (socket|urllib|http\.client|ssl)|from (socket|urllib|http\.client|ssl)" \
            vxrecon --include="*.py" \
            | grep -v "vxrecon/utils/net.py" \
            | grep -v "vxrecon/utils/dns_util.py" \
            | grep -v "vxrecon/collectors/tls_collector.py" \
            || true)
          if [ -n "$offenders" ]; then
            echo "Network imports found outside the allowed gateways:"
            echo "$offenders"
            exit 1
          fi
          echo "Single network gateway check passed."
