name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests (offline)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest-output.txt || {
            echo "::error::pytest failed. Failing tests:"
            grep -E "^FAILED|^ERROR" pytest-output.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: CLI smoke test
        run: |
          python -m vxrecon version
          python -m vxrecon doctor

  lint:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff check
        run: ruff check vxrecon tests --select E,F,W --ignore E501 || true
      - name: Byte-compile all modules
        run: python -m compileall -q vxrecon

  no-network-guard:
    name: Verify single network gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure only approved modules import network-capable libraries
        shell: bash
        run: |
          # Modules allowed to touch sockets / raw TLS / raw HTTP:
          #   - utils/net.py        : the single HTTP gateway
          #   - utils/dns_util.py   : DNS resolver (uses dnspython/socket)
          #   - collectors/tls_collector.py : TLS handshake for cert inspection
          # NOTE: urllib.parse is pure string handling and is NOT a network
          # capability, so it is deliberately excluded from this check.
          pattern='import (socket|ssl|http\.client)|import urllib\.request|from (socket|http\.client)|from urllib\.request|from ssl'
          offenders=$(grep -rEl "$pattern" vxrecon --include="*.py" \
            | grep -vE "vxrecon/utils/net\.py|vxrecon/utils/dns_util\.py|vxrecon/collectors/tls_collector\.py" \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::Network-capable imports found outside the approved gateways:"
            echo "$offenders"
            exit 1
          fi
          echo "Single network gateway check passed."
